services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: spc-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: spc_db
      POSTGRES_USER: spc_user
      POSTGRES_PASSWORD: spc_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spc_user -d spc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: spc_db
      DB_USER: spc_user
      DB_PASSWORD: spc_password
      SPC_IMAGE_ROOT: /data/spc-images
      SPC_BACKUP_ROOT: /backups
      REQUEST_LOG_DIR: /data/logs
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: spc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
